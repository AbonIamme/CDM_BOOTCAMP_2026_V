How it works:

Paddle: u_in[0] = left, u_in[1] = right (4 px/frame), clamped to the screen.
Ball: bounces off side/top walls and the paddle; if it gets past the paddle it respawns center-screen.
Bricks: 8×4 grid (32 bricks) as one bit-vector brick_alive; a brick disappears on hit and flips the ball's vertical direction. Clearing all bricks reloads the level.
All game-state updates happen once per frame (frame_tick, derived from hpos/vpos like the sync generator), so it runs at normal speed regardless of pixel clock rate — same pattern as the reference module.
Colors: white ball, cyan paddle, bricks colored red/yellow/green/blue by row.
reset restarts everything (paddle centered, ball centered, all bricks back). This should drop straight into 8bitworkshop or any Verilog VGA testbench that expects hsync/vsync/rgb outputs.


